<!DOCTYPE html>
<html lang="af">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psalm Speler</title>
    <style>
        .psalm-container {
            display: flex;
            justify-content: center;
            min-height: auto;
            padding: 20px;
            box-sizing: border-box;
        }
        .psalm-player {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .psalm-player h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .psalm-player select, .psalm-player input {
            padding: 10px;
            margin: 10px 0;
            width: 80%;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        .psalm-player button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .psalm-player button:hover {
            background-color: #45a049;
        }
        .psalm-player audio {
            margin-top: 20px;
            width: 80%;
        }
        .error-message {
            color: red;
            margin-top: 10px;
            display: none;
        }
        .psalm-text {
            margin-top: 20px;
            text-align: left;
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
        }
        .psalm-score {
            margin-top: 20px;
            max-width: 100%;
            height: auto;
            display: none;
        }
    </style>
</head>

    <script>
        // Metriese Psalms Player Logic
        let metrieseCurrentRepeats = 0;
        let metrieseTotalRepeats = 0;
        let metrieseCanPlay = false;
        let isPlaybackAttempted = false;

        const metrieseAudio        = document.getElementById('metriese-psalm-audio');
        const metrieseErrorMessage = document.getElementById('metriese-error-message');
        const metriesePsalmText    = document.getElementById('metriese-psalm-text');
        const metriesePsalmScore   = document.getElementById('metriese-psalm-score');
        const metriesePsalmSelect  = document.getElementById('metriese-psalm-select');
        const metrieseRepeatsInput = document.getElementById('metriese-repeats');
        const metrieseMaxVersesSpan = document.getElementById('metriese-max-verses');

        function showMetrieseError(message) {
            metrieseErrorMessage.style.display = 'block';
            metrieseErrorMessage.textContent = message;
            console.error('Metriese:', message);
        }

        function clearMetrieseError() {
            metrieseErrorMessage.style.display = 'none';
            metrieseErrorMessage.textContent = '';
        }

        function updateMetrieseMaxVerses() {
            const selectedOption = metriesePsalmSelect.options[metriesePsalmSelect.selectedIndex];
            const maxVerses = selectedOption ? parseInt(selectedOption.getAttribute('data-verses')) : 0;
            metrieseRepeatsInput.setAttribute('max', maxVerses);
            metrieseMaxVersesSpan.textContent = maxVerses;

            if (metrieseRepeatsInput.value > maxVerses && maxVerses > 0) {
                metrieseRepeatsInput.value = maxVerses;
            }
        }

        function displayMetriesePsalmContent() {
            const selectedOption = metriesePsalmSelect.options[metriesePsalmSelect.selectedIndex];
            const textUrl  = selectedOption?.getAttribute('data-text-url')  || '';
            const scoreUrl = selectedOption?.getAttribute('data-score-url') || '';

            // Reset content
            metriesePsalmText.textContent = 'Laai teks...';
            metriesePsalmScore.style.display = 'none';
            metriesePsalmScore.src = '';
            clearMetrieseError();

            // Psalm text
            if (textUrl) {
                fetch(textUrl, { method: 'GET', mode: 'cors' })
                    .then(response => {
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        return response.text();
                    })
                    .then(data => {
                        metriesePsalmText.textContent = data || 'Geen teks beskikbaar nie.';
                    })
                    .catch(err => {
                        console.error('Text fetch error:', err);
                        showMetrieseError('Fout met psalmteks: ' + err.message);
                        metriesePsalmText.textContent = 'Kon nie teks laai nie.';
                    });
            } else {
                metriesePsalmText.textContent = 'Geen teks beskikbaar vir hierdie psalm nie.';
            }

            // Psalm score
            if (scoreUrl) {
                metriesePsalmScore.src = scoreUrl;
                metriesePsalmScore.style.display = 'block';

                fetch(scoreUrl, { method: 'HEAD', mode: 'cors' })
                    .then(r => {
                        if (!r.ok) throw new Error(`Score HTTP ${r.status}`);
                    })
                    .catch(err => {
                        console.error('Score fetch error:', err);
                        showMetrieseError('Kan nie partituur laai nie: ' + err.message);
                        metriesePsalmScore.style.display = 'none';
                        metriesePsalmScore.src = '';
                    });
            } else {
                metriesePsalmScore.style.display = 'none';
            }
        }

        function playMetriesePsalm() {
            clearMetrieseError();

            const selectedOption = metriesePsalmSelect.options[metriesePsalmSelect.selectedIndex];
            const audioUrl = selectedOption?.getAttribute('data-audio-url') || '';

            const repeats = parseInt(metrieseRepeatsInput.value);

            if (!audioUrl) {
                showMetrieseError('Kies asseblief \'n Psalm met geldige oudio.');
                return;
            }
            if (isNaN(repeats) || repeats < 1) {
                showMetrieseError('Voer asseblief \'n geldige aantal verse in.');
                return;
            }

            const maxVerses = parseInt(selectedOption.getAttribute('data-verses'));
            if (repeats > maxVerses) {
                showMetrieseError(`Jy kan maksimum ${maxVerses} verse kies vir hierdie psalm.`);
                return;
            }

            console.log('Loading audio:', audioUrl);

            isPlaybackAttempted = true;
            metrieseAudio.src = audioUrl;

            metrieseCurrentRepeats = 0;
            metrieseTotalRepeats = repeats;
            metrieseCanPlay = false;

            // Check if file exists + try play
            fetch(audioUrl, { method: 'HEAD', mode: 'cors' })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Audio HTTP ${response.status}`);
                    }
                    metrieseAudio.load();
                    return metrieseAudio.play();
                })
                .then(() => {
                    metrieseCanPlay = true;
                    console.log('Playback started');
                    clearMetrieseError();
                })
                .catch(error => {
                    console.error('Playback / availability error:', error);
                    showMetrieseError('Kon nie oudio speel nie: ' + error.message);
                    isPlaybackAttempted = false;
                });
        }

        metrieseAudio.addEventListener('error', function() {
            if (isPlaybackAttempted && !metrieseCanPlay && metrieseAudio.src) {
                const code = metrieseAudio.error?.code;
                let msg = 'Oudio fout – onbekende probleem.';
                if (code === 4) msg = 'Lêer word nie ondersteun of bestaan nie.';
                else if (code === 3) msg = 'Dekodeer fout.';
                else if (code === 2) msg = 'Netwerk probleem.';
                showMetrieseError(msg);
            }
        });

        metrieseAudio.addEventListener('canplay', () => {
            metrieseCanPlay = true;
            clearMetrieseError();
        });

metrieseAudio.addEventListener('ended', function() {
    metrieseCurrentRepeats++;

    if (metrieseCurrentRepeats < metrieseTotalRepeats) {
        // 1 second = 1000 milliseconds
        setTimeout(() => {
            this.currentTime = 0;
            this.play().catch(err => {
                showMetrieseError('Herhaal fout: ' + err.message);
            });
        }, 0); //verander 0 na millisekondes om tyd tussen verse te verander
    } else {
        isPlaybackAttempted = false;
    }
});

        metriesePsalmSelect.addEventListener('change', function() {
            clearMetrieseError();
            metrieseAudio.pause();
            metrieseAudio.currentTime = 0;
            metrieseAudio.src = '';
            metrieseCurrentRepeats = 0;
            metrieseCanPlay = false;
            isPlaybackAttempted = false;

            updateMetrieseMaxVerses();
            displayMetriesePsalmContent();
        });

        // Initial setup
        updateMetrieseMaxVerses();
        displayMetriesePsalmContent();
    </script>
</body>
</html>
